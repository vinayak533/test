# Static site. There is no build step and there must not be one: the page and
# its three data files are served exactly as they sit in the repository.
#
# This file exists so the settings live with the code rather than in the
# Netlify UI, where an auto-detected build command or a publish directory
# pointing somewhere other than the repository root is what serves a 404
# instead of the page.
#
# sync_i18n_inline.js is deliberately NOT a build command. It is a maintenance
# script: it copies LANGS and UI from misty_i18n.js into index.html, and it is
# run by hand after editing either, with the result committed. Running it at
# deploy time would rewrite a tracked file on the build machine for no gain.

[build]
  base = "."
  publish = "."

# No `command` key. Netlify treats an absent command as "publish as-is",
# which is what a plain HTML and JavaScript project wants.

# Secrets scanning fails the build when an environment variable's value
# appears in the repository. These four are settings, not secrets, and their
# values are written into the code on purpose ("Asia/Kolkata", the default
# Jev model and base URL, a timeout in ms). Only they are skipped: the real
# secrets (SUPABASE_SERVICE_ROLE_KEY, SUPABASE_ANON_KEY, JEV_API_KEY,
# CHAT_STATE_SECRET) are still scanned for.
[build.environment]
  SECRETS_SCAN_OMIT_KEYS = "HOTEL_TIMEZONE,JEV_MODEL,JEV_BASE_URL,JEV_TIMEOUT_MS"
#
# No catch-all rewrite. This is one static page with in-page anchors, not a
# single-page app, so rewriting everything to index.html would only hide real
# 404s. `/` resolves to index.html on its own, including on refresh. The only
# redirects below are hard 404s for private folders.

# ---- the ChatBot backend ------------------------------------------------------
# POST /api/chat is netlify/functions/chat.mjs, GET /api/config is
# netlify/functions/config.mjs and GET /api/hotels is netlify/functions/hotels.mjs
# (paths are set in the files). /api/config serves only the Supabase URL and
# anon key, for staff sign-in on the dashboard; /api/hotels only the active
# hotels' ids and names, for the hotel picker.
# Netlify bundles functions on its own; there is still no build command.
# Secrets (SUPABASE_*, JEV_*) are set in Site configuration → Environment
# variables, never in this file or the page.
[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"
  included_files = ["server/**"]

# The site publishes the repository root, so keep everything that is not the
# page itself from being served. These are hard 404s, not a SPA fallback.
[[redirects]]
  from = "/.env*"
  to = "/404"
  status = 404
  force = true
[[redirects]]
  from = "/server/*"
  to = "/404"
  status = 404
  force = true
[[redirects]]
  from = "/supabase/*"
  to = "/404"
  status = 404
  force = true
[[redirects]]
  from = "/scripts/*"
  to = "/404"
  status = 404
  force = true
[[redirects]]
  from = "/tests/*"
  to = "/404"
  status = 404
  force = true
[[redirects]]
  from = "/node_modules/*"
  to = "/404"
  status = 404
  force = true
